<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nearby — a close AI friend</title>
<meta name="description" content="Nearby is a companion with its own temperament, not an assistant with a personality bolted on. Wake it up and talk to it here.">
<meta name="theme-color" content="#191420">
<!-- Preview build: CONFIG.apiBase in js/copy.js is still empty, so the chat
     has nothing to talk to. Remove this line and robots.txt once it points at
     the real endpoint. -->
<meta name="robots" content="noindex">
<meta property="og:title" content="Nearby — a close AI friend">
<meta property="og:description" content="Wake it up, and it will tell you how it intends to treat you.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23ffb07a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<canvas id="stage" aria-hidden="true"></canvas>
<div id="fallback-host" class="fallback-host" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<div id="ring" class="ring" aria-hidden="true">
  <svg viewBox="0 0 100 100">
    <circle class="ring__track" cx="50" cy="50" r="48" pathLength="1"></circle>
    <circle id="ring-arc" class="ring__arc" cx="50" cy="50" r="48" pathLength="1"></circle>
  </svg>
</div>

<header class="topbar">
  <a class="wordmark" href="#what">Nearby</a>
  <button id="skip" type="button" class="ghost-button">skip</button>
</header>

<main>
  <section class="hero">
    <div id="hero-ui" class="hero__ui">
      <p id="step" class="step"></p>
      <p id="question" class="question"></p>
      <p id="voice" class="voice" aria-live="polite"></p>
      <div id="choices" class="choices"></div>
      <div id="promises" class="promises"></div>

      <div id="cta" class="cta-block">
        <button id="cta-link" type="button" class="cta">
          <span class="cta__label">Say something to it</span>
          <span class="cta__arrow" aria-hidden="true">→</span>
        </button>
        <p id="cta-note" class="cta-note"></p>
        <button id="again" type="button" class="ghost-button is-hidden"></button>
      </div>

      <p id="hint" class="hint"></p>
      <div id="scroll-cue" class="scroll-cue"><span></span></div>
    </div>
  </section>

  <div class="page">
    <div id="sections" class="sections"></div>

    <footer class="footer">
      <p class="footer__wordmark">Nearby</p>
      <p id="footer-meaning" class="footer__meaning"></p>
      <p id="footer-note" class="footer__note"></p>
      <button type="button" class="cta cta--small">
        <span>Talk to it</span>
        <span aria-hidden="true">→</span>
      </button>
    </footer>
  </div>
</main>

<div id="chat" class="chat" hidden>
  <div class="chat__panel" role="dialog" aria-modal="true" aria-labelledby="chat-title">
    <header class="chat__bar">
      <p id="chat-title" class="chat__title"></p>
      <p id="chat-remaining" class="chat__remaining" aria-live="polite"></p>
      <button id="chat-close" type="button" class="ghost-button"></button>
    </header>
    <div id="chat-log" class="chat__log" aria-live="polite"></div>
    <form id="chat-form" class="chat__form">
      <input id="chat-input" class="chat__input" type="text" autocomplete="off"
             maxlength="2000" enterkeyhint="send">
      <button id="chat-send" type="submit" class="chat__send"></button>
    </form>
    <p id="chat-note" class="chat__note"></p>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
